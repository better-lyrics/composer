name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Duplication check
        run: pnpm jscpd

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (jsdom)
        run: pnpm test:unit --shard=${{ matrix.shard }}/2

  component:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Chromium and its system libraries ship in the image, so no apt step can stall the job.
    # Keep the tag on the playwright version in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Component tests (Chromium)
        run: pnpm test:component --shard=${{ matrix.shard }}/3

  # The master ruleset requires a check named "test".
  test:
    if: always()
    needs: [checks, unit, component]
    runs-on: ubuntu-latest

    steps:
      - name: All test jobs passed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
